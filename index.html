<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>笨蛋随机吃饭生成器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif;}
body{background:#f5f7fa;padding:12px;font-size:14px;}
.box{width:100%;background:#fff;border-radius:12px;padding:15px;box-shadow:0 2px 8px #eee;}
h2{font-size:18px;text-align:center;color:#222;margin-bottom:15px;}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:15px;}
.btn-single{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:15px;}
button{padding:9px 12px;border:none;border-radius:6px;font-size:13px;flex:1;min-width:90px;cursor:pointer;}
#genAll{background:#16a085;color:#fff;}
#copyAll{background:#3474d9;color:#fff;}
.btn-bf{background:#ff9500;color:#fff;}
.btn-lu{background:#e53935;color:#fff;}
.btn-din{background:#1976d2;color:#fff;}
.choose-box{width:100%;padding:12px;border:1px solid #e5e5e5;border-radius:10px;margin-bottom:15px;display:none;}
.choose-box h4{font-size:15px;margin-bottom:8px;color:#333;}
.opt-item{padding:8px;background:#f8f9fa;border-radius:5px;margin:6px 0;line-height:1.5;}
table{width:100%;border-collapse:collapse;}
th,td{border:1px solid #eee;padding:8px 5px;text-align:center;word-break:break-all;}
th{background:#f1f5f8;font-size:13px;}
td{font-size:12px;line-height:1.4;}
.bf{color:#e86c00;}
.lu{color:#c82423;}
.din{color:#2174b9;}
.sn{color:#9349bd;}
</style>
</head>
<body>
<div class="box">
    <h2>30天90份不重样食谱｜无海鲜</h2>

    <div class="btn-row">
        <button id="genAll">生成整月食谱</button>
        <button id="copyAll">一键复制食谱</button>
    </div>

    <div class="btn-single">
        <button class="btn-bf" id="randBf">选3款早餐</button>
        <button class="btn-lu" id="randLu">选3款午餐</button>
        <button class="btn-din" id="randDin">选3款晚餐</button>
    </div>

    <div class="choose-box" id="chooseArea">
        <h4 id="chooseTitle">推荐菜品</h4>
        <div id="optList"></div>
    </div>

    <table>
        <thead>
            <tr>
                <th>天数</th>
                <th class="bf">早餐</th>
                <th class="lu">午餐</th>
                <th class="din">晚餐</th>
                <th class="sn">加餐</th>
            </tr>
        </thead>
        <tbody id="mealBody"></tbody>
    </table>
</div>

<script>
// 固定菜品库 完全不变
const breakfastArr = [
    "小米粥配水煮蛋", "燕麦牛奶粥+茶叶蛋", "全麦吐司+热豆浆", "甜玉米+鸡蛋羹",
    "蒸红薯+原味酸奶", "葱花卷+煎荷包蛋", "杂粮八宝粥+鲜肉包子", "南瓜粥+蔬菜蒸饺",
    "清汤鸡蛋面+小菜", "紫薯山药+纯牛奶", "青菜瘦肉粥+豆沙包", "蒸芋头+卤蛋",
    "黑芝麻糊+鸡蛋饼", "白粥+肉松馒头", "山药粥+菜包", "玉米糊+煎蛋卷",
    "豆浆+葱油饼", "银耳粥+水煮鸭蛋", "牛奶泡麦片+小馒头", "萝卜丝饼+小米汤",
    "南瓜馒头+温牛奶", "青菜粥+鸡蛋卷", "黑米粥+蒸饺", "面片汤+卤鸡蛋",
    "红豆粥+花卷", "燕麦糊+蔬菜蛋饼", "雪梨粥+软面包", "薏米粥+鲜肉烧麦",
    "南瓜羹+煎蛋", "玉米粥+全麦饼"
];

const lunchArr = [
    "白米饭+青椒肉丝+清炒油麦菜", "杂粮饭+红烧肉+酸辣土豆丝", "糙米饭+糖醋里脊+凉拌黄瓜",
    "大米饭+回锅肉+手撕包菜", "米饭+梅菜扣肉+蒜蓉生菜", "米饭+农家小炒肉+清炒豆芽",
    "米饭+黑椒牛柳+清炒西兰花", "米饭+土豆炖牛腩+胡萝卜片", "米饭+芹菜炒牛肉+娃娃菜",
    "米饭+红烧牛肉+清炒冬瓜", "米饭+水煮牛肉+凉拌生菜", "米饭+葱爆牛肉+香菇青菜",
    "米饭+胡萝卜炖羊肉+大白菜", "米饭+孜然羊肉+凉拌木耳", "米饭+葱爆羊肉+清炒菠菜",
    "米饭+香辣牛蛙+清炒丝瓜", "米饭+紫苏牛蛙+时令青菜", "米饭+青椒牛蛙+炒西葫芦",
    "米饭+干锅牛蛙+凉拌藕片", "蛋炒饭+番茄炒蛋+凉拌紫甘蓝", "土豆焖饭+香煎鸡胸+青菜汤",
    "米饭+粉蒸肉+清炒芥蓝", "米饭+芹菜炒猪肉+干煸豆角", "米饭+排骨炖萝卜+清炒茼蒿",
    "米饭+香菇滑鸡+炒小白菜", "米饭+红烧鸡块+凉拌海带", "米饭+腐竹烧肉+清炒笋片",
    "米饭+小炒黄牛肉+凉拌三丝", "米饭+羊肉炖豆腐+炒生菜", "米饭+牛蛙烧莴笋+清炒空心菜"
];

const dinnerArr = [
    "清汤挂面+豆腐青菜", "杂粮粥+香蒸肉饼", "蒸甜玉米+瘦肉炒西葫芦",
    "清汤米粉+鸡蛋炒丝瓜", "小碗米饭+瘦肉丸子清汤", "蒸南瓜+菌菇瘦肉煲",
    "山药养胃粥+清炒杂蔬", "青菜面片+凉拌嫩豆腐", "紫薯粥+鸡蛋炒木耳",
    "小米清汤粥+清炒瘦肉丝", "荞麦面+番茄鸡蛋卤", "蒸山药+白菜炖豆腐",
    "青菜粥+炒鸡蛋黄瓜", "蔬菜小馄饨+凉拌黄瓜", "红豆薏米粥+清炒豆干",
    "冬瓜瘦肉汤+全麦馒头", "丝瓜蛋汤+蒸红薯", "菌菇汤+素炒时蔬",
    "白菜豆腐煲+小份米饭", "瘦肉丝瓜粥+凉拌豆芽", "胡萝卜粥+煎嫩蛋",
    "清汤乌冬面+青菜", "蒸芋头+鸡蛋炒番茄", "生菜瘦肉粥+凉拌千张",
    "西葫芦鸡蛋汤+玉米馒头", "豆芽瘦肉粥+清炒生菜", "南瓜清汤面+卤豆干",
    "萝卜瘦肉粥+凉拌青菜", "菌菇鸡蛋面+小咸菜", "青菜豆腐粥+蒸蛋"
];

const snackArr = [
    "原味核桃仁", "巴旦木坚果", "原味熟花生", "全脂纯牛奶", "新鲜苹果",
    "香甜香蕉", "奇异果", "无糖原味酸奶", "去核红枣干", "圣女果",
    "原味腰果", "鲜橙子", "梨子", "常温奶酪小块", "草莓",
    "芒果果肉", "葡萄干", "原味南瓜子", "鲜柚子肉", "小番茄",
    "黑芝麻丸", "鲜葡萄", "鲜火龙果", "脆冬枣", "青皮橘子",
    "原味松子仁", "鲜枇杷", "无花果干", "常温乳酸菌", "鲜油桃"
];

// 生成整月表格
function makeAllMeal(){
    let html = "";
    for(let i=0;i<30;i++){
        html += `<tr>
            <td>第${i+1}天</td>
            <td class="bf">${breakfastArr[i]}</td>
            <td class="lu">${lunchArr[i]}</td>
            <td class="din">${dinnerArr[i]}</td>
            <td class="sn">${snackArr[i]}</td>
        </tr>`
    }
    document.getElementById("mealBody").innerHTML = html;
    document.getElementById("chooseArea").style.display = "none";
}

// 随机取3个不重复
function getThreeRandom(list){
    let temp = [...list];
    let res = [];
    for(let i=0;i<3;i++){
        let idx = Math.floor(Math.random()*temp.length);
        res.push(temp.splice(idx,1)[0]);
    }
    return res;
}

// 展示3款选择
function showChoose(title,list){
    let box = document.getElementById("chooseArea");
    document.getElementById("chooseTitle").innerText = title;
    let three = getThreeRandom(list);
    let h = "";
    three.forEach((item,idx)=>{
        h += `<div class="opt-item">${idx+1}.${item}</div>`
    });
    document.getElementById("optList").innerHTML = h;
    box.style.display = "block";
}

// 复制文本
document.getElementById("copyAll").addEventListener("click",()=>{
    let text = "30天三餐全不重样食谱\n";
    document.querySelectorAll("#mealBody tr").forEach(tr=>{
        let t=tr.querySelectorAll("td");
        text += `${t[0].innerText} 早餐:${t[1].innerText} 午餐:${t[2].innerText} 晚餐:${t[3].innerText} 加餐:${t[4].innerText}\n`
    });
    navigator.clipboard.writeText(text).then(()=>alert("复制成功"));
});

// 绑定点击
document.getElementById("randBf").onclick=()=>showChoose("3款精选早餐",breakfastArr);
document.getElementById("randLu").onclick=()=>showChoose("3款丰盛午餐",lunchArr);
document.getElementById("randDin").onclick=()=>showChoose("3款清淡晚餐",dinnerArr);
document.getElementById("genAll").onclick=makeAllMeal;
window.onload=makeAllMeal;
</script>
</body>
</html>
