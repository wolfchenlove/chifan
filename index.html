<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>30天随机三餐食谱生成器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"微软雅黑",sans-serif;}
body{background:#f5f7fa;padding:20px;}
.box{max-width:1100px;margin:0 auto;background:#fff;padding:25px;border-radius:12px;box-shadow:0 2px 15px #ddd;}
h2{text-align:center;color:#333;margin-bottom:20px;}
.btn-group{text-align:center;margin-bottom:25px;}
button{padding:10px 22px;border:none;border-radius:6px;font-size:15px;cursor:pointer;margin:0 8px;}
#refresh{background:#27ae60;color:#fff;}
#copy{background:#3498db;color:#fff;}
table{width:100%;border-collapse:collapse;margin-top:10px;}
th,td{border:1px #eee solid;padding:12px;text-align:center;}
th{background:#f1f5f9;color:#222;}
.breakfast{color:#e67e22;}
.lunch{color:#c0392b;}
.dinner{color:#2980b9;}
.snack{color:#8e44ad;}
</style>
</head>
<body>
<div class="box">
    <h2>30天一月不重样随机食谱｜含牛羊猪肉+牛蛙｜无海鲜</h2>
    <div class="btn-group">
        <button id="refresh">重新随机生成30天</button>
        <button id="copy">一键复制全部食谱</button>
    </div>
    <table>
        <thead>
            <tr>
                <th>天数</th>
                <th class="breakfast">早餐（清淡养胃）</th>
                <th class="lunch">午餐（荤素丰盛）</th>
                <th class="dinner">晚餐（低脂易消化）</th>
                <th class="snack">健康加餐</th>
            </tr>
        </thead>
        <tbody id="mealTable"></tbody>
    </table>
</div>

<script>
// 早餐库 清淡为主
const breakfastList = [
    "小米粥+水煮蛋","燕麦牛奶粥+茶叶蛋","全麦面包+纯牛奶","玉米+蒸蛋羹",
    "红薯+无糖豆浆","葱油花卷+煎蛋","杂粮粥+鲜肉小笼包","南瓜粥+瘦肉蒸饺",
    "鸡蛋挂面+小咸菜","紫薯+全脂酸奶","蒸山药+水煮蛋","青菜粥+豆沙包"
];

// 午餐库 丰盛硬菜 含猪肉/牛肉/羊肉/牛蛙
const lunchList = [
    //猪肉
    "白米饭+青椒肉丝+清炒油麦菜","杂粮饭+红烧肉+酸辣土豆丝","糙米饭+糖醋里脊+凉拌黄瓜",
    "米饭+回锅肉+手撕包菜","米饭+梅菜扣肉+蒜蓉青菜","米饭+农家小炒肉+清炒豆芽",
    //牛肉
    "米饭+黑椒牛柳+西兰花","米饭+土豆炖牛腩+胡萝卜","米饭+芹菜炒牛肉+娃娃菜",
    "米饭+红烧牛肉+冬瓜片","米饭+水煮牛肉+生菜","米饭+葱爆牛肉+菌菇",
    //羊肉
    "米饭+胡萝卜炖羊肉+白菜","米饭+孜然羊肉+凉拌木耳","米饭+葱爆羊肉+清炒菠菜",
    //牛蛙
    "米饭+香辣牛蛙+丝瓜","米饭+紫苏牛蛙+青菜","米饭+青椒牛蛙+西葫芦",
    //家常荤素
    "蛋炒饭+番茄炒蛋+凉拌紫甘蓝","土豆饭+香煎鸡胸+青菜汤"
];

// 晚餐库 清淡少油好消化
const dinnerList = [
    "清汤面+豆腐青菜","杂粮粥+蒸肉饼","蒸玉米+瘦肉炒西葫芦",
    "清汤米粉+鸡蛋炒丝瓜","小份米饭+瘦肉丸子汤","蒸南瓜+菌菇瘦肉煲",
    "山药粥+清炒时蔬","青菜面片+凉拌豆腐","紫薯粥+虾仁滑蛋(无海鲜版鸡蛋滑蛋)"
];

// 加餐库 营养增脂
const snackList = [
    "原味核桃","巴旦木坚果","熟花生","全脂纯牛奶","香蕉",
    "苹果","猕猴桃","无糖酸奶","红枣干","圣女果"
];

// 随机取食材
function getRandom(arr){
    return arr[Math.floor(Math.random()*arr.length)];
}

// 生成30天数据
function create30DayMeal(){
    let html = "";
    for(let i=1;i<=30;i++){
        let bf = getRandom(breakfastList);
        let lu = getRandom(lunchList);
        let din = getRandom(dinnerList);
        let sn = getRandom(snackList);
        html += `
        <tr>
            <td>第${i}天</td>
            <td class="breakfast">${bf}</td>
            <td class="lunch">${lu}</td>
            <td class="dinner">${din}</td>
            <td class="snack">${sn}</td>
        </tr>
        `;
    }
    document.getElementById("mealTable").innerHTML = html;
}

// 复制文本
document.getElementById("copy").addEventListener("click",()=>{
    let text = "30天随机三餐食谱（无海鲜·家常易做）\n";
    let trs = document.querySelectorAll("#mealTable tr");
    trs.forEach((tr,idx)=>{
        if(idx===0)return;
        let tds = tr.querySelectorAll("td");
        text += `${tds[0].innerText} 早餐:${tds[1].innerText} 午餐:${tds[2].innerText} 晚餐:${tds[3].innerText} 加餐:${tds[4].innerText}\n`;
    });
    navigator.clipboard.writeText(text).then(()=>alert("✅ 全部食谱复制成功！"));
});

// 初始化
window.onload = create30DayMeal;
document.getElementById("refresh").addEventListener("click",create30DayMeal);
</script>
</body>
</html>
